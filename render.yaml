services:
  - type: web
    name: simons-gestion-comercial
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Deployment__BehindProxy
        value: "true"
      - key: Deployment__SecureCookies
        value: "true"
      - key: Deployment__DataProtectionKeysPath
        value: /keys
      - key: DemoUsers__Enabled
        value: "true"
      - key: DemoData__Enabled
        value: "false"
      - key: DemoAccess__ShowCredentials
        value: "true"
      - key: DemoUsers__PromoterEmail
        value: demo.promotor@simons.test
      - key: DemoUsers__PromoterPassword
        value: DemoPromotor!2026
      - key: DemoUsers__PromoterName
        value: Promotor de demostración
      - key: DemoUsers__ClientEmail
        value: cliente.demo@simons.test
      - key: DemoUsers__ClientName
        value: Cliente de demostración
      - key: DemoUsers__AllowSimplePassword
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: InitialAdmin__Email
        sync: false
      - key: InitialAdmin__Password
        sync: false
